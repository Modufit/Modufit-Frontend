<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>ModuFit 로그인</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <div class="auth-title">로그인</div>

        <div id="login-error" class="message-error" style="display: none"></div>

        <div class="auth-input">
          <label for="login-email">이메일</label>
          <input id="login-email" type="email" placeholder="example@mail.com" />
        </div>

        <div class="auth-input">
          <label for="login-password">비밀번호</label>
          <input
            id="login-password"
            type="password"
            placeholder="비밀번호를 입력하세요"
          />
        </div>

        <button id="login-btn" class="auth-button">로그인</button>

        <div class="auth-footer">
          아직 계정이 없으신가요?
          <a href="register.html">회원가입하기</a>
        </div>
      </div>
    </div>

    <script src="../styles/index.js"></script>
  </body>
</html>
