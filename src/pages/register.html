<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>ModuFit 회원가입</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <div class="auth-title">회원가입</div>

        <div id="register-error" class="message-error" style="display: none"></div>
        <div id="register-success" class="message-success" style="display: none"></div>

        <div class="auth-input">
          <label for="reg-email">이메일</label>
          <input id="reg-email" type="email" placeholder="example@mail.com" />
        </div>

        <div class="auth-input">
          <label for="reg-name">이름</label>
          <input id="reg-name" type="text" placeholder="이름을 입력하세요" />
        </div>

        <div class="auth-input">
          <label for="reg-password">비밀번호</label>
          <input
            id="reg-password"
            type="password"
            placeholder="비밀번호를 입력하세요"
          />
        </div>

        <div class="auth-input">
          <label for="reg-password2">비밀번호 확인</label>
          <input
            id="reg-password2"
            type="password"
            placeholder="비밀번호를 다시 입력하세요"
          />
        </div>

        <button id="register-btn" class="auth-button">회원가입</button>
        <div id="register-message" style="margin-top:10px; display:none;"></div>

        <div class="auth-footer">
          이미 계정이 있으신가요?
          <a href="login.html">로그인하기</a>
        </div>
      </div>
    </div>

    <script src="../register.js"></script>
  </body>
</html>
